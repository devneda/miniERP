{% extends 'base.html' %}

{% block title %}{% if form.instance.pk %}Editar{% else %}Crear{% endif %} Producto - MiniERP{% endblock %}

{% block content %}
    <h1>{% if form.instance.pk %}Editar{% else %}Nuevo{% endif %} Producto</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{% url 'producto_list' %}" class="btn btn-danger">Cancelar</a>
    </form>
{% endblock %}
